<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shimondle</title>
    <link rel="icon" href="/icon.png" />
  </head>
  <body>
    <div id="app">
      <aside id="sidebar">
        <div class="sb-head">
          <div class="brand">
            <img id="brand-mark" class="brand-mark" alt="" />
            <span class="brand-name">shimondle</span>
          </div>
        </div>

        <button id="new-chat" class="new-chat">
          <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M8 3.4v9.2M3.4 8h9.2"/></svg>
          <span>New chat</span>
          <kbd>⌘N</kbd>
        </button>

        <div class="sb-label">Recent</div>
        <div id="convo-list" class="convo-list"></div>

        <div class="sb-foot">
          <button id="model-btn" class="model-btn">
            <span class="model-dot"></span>
            <span class="model-meta">
              <span class="model-name" id="model-name">No model</span>
              <span class="model-sub" id="model-sub">Connect Ollama</span>
            </span>
            <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 6.5 8 10.5l4-4"/></svg>
          </button>
          <button id="settings-btn" class="icon-btn" aria-label="Settings">
            <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M2.6 5.2h1.4M8.4 5.2h5M2.6 10.8h5.2M12.2 10.8h1.2"/><circle cx="6.2" cy="5.2" r="1.8"/><circle cx="10.2" cy="10.8" r="1.8"/></svg>
          </button>
        </div>
      </aside>

      <main id="main">
        <header id="topbar" data-tauri-drag-region>
          <div class="tb-title" id="tb-title">New chat</div>
          <div class="tb-actions">
            <button id="status" class="status" title="Ollama connection">
              <i></i><span class="status-text">checking</span>
            </button>
          </div>
        </header>

        <section id="transcript" class="transcript"></section>

        <footer id="composer" class="composer">
          <div class="composer-inner">
            <textarea id="input" rows="1" placeholder="Ask anything. Nothing leaves this machine."></textarea>
            <div class="composer-row">
              <button id="composer-model" class="chip">
                <span class="chip-dot"></span><span id="chip-model">no model</span>
              </button>
              <button id="composer-think" class="chip think-chip" hidden aria-pressed="true" title="Thinking mode">
                <svg viewBox="0 0 16 16" width="12" height="12" fill="currentColor" aria-hidden="true"><path d="M8 1.4l1.5 4.1L13.6 7 9.5 8.5 8 12.6 6.5 8.5 2.4 7l4.1-1.5L8 1.4z"/></svg>
                <span class="think-label">Thinking</span>
              </button>
              <div class="spacer"></div>
              <button id="send" class="send" aria-label="Send">
                <svg class="send-arrow" viewBox="0 0 20 20" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M10 15.5v-11M5.2 9.2 10 4.4l4.8 4.8"/></svg>
                <svg class="send-stop" viewBox="0 0 20 20" width="15" height="15" fill="currentColor"><rect x="5" y="5" width="10" height="10" rx="2"/></svg>
              </button>
            </div>
          </div>
          <div class="hint"><span>Enter to send</span><span class="dot">·</span><span>Shift + Enter for a new line</span><span class="dot">·</span><span>runs locally with Ollama</span></div>
        </footer>
      </main>
    </div>
    <div id="popover-root"></div>
    <div id="modal-root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
